services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: turborepo-frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/frontend/node_modules
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev --workspace=@uno/frontend

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: turborepo-backend
    ports:
      - "2567:2567"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/game_db
      NODE_ENV: development
    command: npm run dev --workspace=@uno/backend

  postgres:
    image: postgres:16
    container_name: turborepo-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: