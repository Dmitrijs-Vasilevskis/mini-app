name: uno-mini-app

services:

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: uno-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-2567}:2567"
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 2567
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-game_db}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
    env_file:
      - path: .env
        required: false

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: uno-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - frontend_node_modules:/app/apps/frontend/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_COLYSEUS_URL: ${VITE_COLYSEUS_URL:-ws://localhost:2567}
    env_file:
      - path: .env
        required: false

volumes:
  postgres_data:
  root_node_modules:
  frontend_node_modules:
  backend_node_modules:
  shared_node_modules:
